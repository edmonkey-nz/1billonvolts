<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1 billion volts in the clouds</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 1000px; margin: 40px auto; padding: 0 20px; background: #363535; }
    h1 { text-align: center; color: #e1e4e8; }
    .text-intro { text-align: center; color: #e1e4e8; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 30px; }
    .card { background: white; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { max-width: 100%; height: 160px; object-fit: cover; border-radius: 4px; }
    .badge { display: inline-block; background: #e1f5fe; color: #0288d1; font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
    .btn { display: inline-block; text-align: center; background: #24292e; color: white; text-decoration: none; padding: 10px; border-radius: 6px; margin-top: 15px; font-weight: 600; }
  </style>
</head>
<body>

  <h1>Laser and Visuals software</h1>
  <div class="text-intro"><p>Free to use for your and others entertainment.</p></div>
  <div class="grid" id="project-list">Loading projects...</div>
<script>
  const username = 'edmonkey-nz';
  const repo = '1billonvolts';
  const folderPath = 'content/projects';

  // Helper to check if a value looks like an image URL/path
  function isImageUrl(val) {
    if (typeof val !== 'string') return false;
    return val.match(/\.(jpeg|jpg|gif|png|svg|webp)$/i) || val.includes('/assets/images/');
  }

  // Helper to check if a value looks like a link
  function isUrl(val) {
    if (typeof val !== 'string') return false;
    return val.startsWith('http://') || val.startsWith('https://');
  }

  // Format key names nicely (e.g. "download_url" -> "Download Url")
  function formatLabel(key) {
    return key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
  }

  async function loadProjects() {
    const container = document.getElementById('project-list');
    container.innerHTML = '';

    try {
      // 1. Fetch file list from GitHub API
      const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folderPath}`);
      if (!response.ok) throw new Error('Could not read project directory.');
      
      const files = await response.json();
      const jsonFiles = files.filter(f => f.name.endsWith('.json'));

      for (const file of jsonFiles) {
        // Fetch fresh JSON content (avoiding API cache)
        const res = await fetch(`${file.download_url}?t=${Date.now()}`);
        if (!res.ok) continue;
        const data = await res.json();

        // 2. Extract standard structural components dynamically
        const card = document.createElement('div');
        card.className = 'card';

        let imageHtml = '';
        let titleHtml = '';
        let badgeHtml = '';
        let bodyHtml = '';
        let linksHtml = '';
        let metaHtml = '';

        // Iterate through ALL fields defined in your JSON
        for (const [key, value] of Object.entries(data)) {
          if (value === null || value === undefined || value === '') continue;

          // A. Hero / Screenshot images
          if (isImageUrl(value)) {
            imageHtml += `<img src="${value}" alt="${key}" style="max-width:100%; height:160px; object-fit:cover; border-radius:6px; margin-bottom:12px;">`;
          }
          // B. Main Title
          else if (key.toLowerCase() === 'title' || key.toLowerCase() === 'name') {
            titleHtml = value;
          }
          // C. Version / Status badges
          else if (key.toLowerCase() === 'version' || key.toLowerCase() === 'tag' || key.toLowerCase() === 'status') {
            badgeHtml += `<span class="badge" style="background:#e1f5fe; color:#0288d1; font-weight:bold; padding:4px 8px; border-radius:4px; font-size:0.8rem; margin-left:8px;">${value}</span>`;
          }
          // D. Links / Action Buttons
          else if (isUrl(value)) {
            linksHtml += `<a href="${value}" class="btn" target="_blank" style="display:inline-block; background:#24292e; color:white; text-decoration:none; padding:8px 12px; border-radius:6px; font-weight:600; margin-top:8px; margin-right:6px; font-size:0.9rem;">${formatLabel(key)}</a>`;
          }
          // E. Primary text / Description
          else if (key.toLowerCase() === 'description' || key.toLowerCase() === 'summary' || typeof value === 'string' && value.length > 60) {
            bodyHtml += `<p style="margin:10px 0; color:#444;">${value}</p>`;
          }
          // F. Catch-all for any other custom fields added in Pages CMS
          else {
            const displayValue = Array.isArray(value) ? value.join(', ') : value;
            metaHtml += `<div style="font-size:0.85rem; color:#666; margin-top:4px;"><strong>${formatLabel(key)}:</strong> ${displayValue}</div>`;
          }
        }

        // Build composite card
        card.innerHTML = `
          <div style="flex:1;">
            ${imageHtml}
            <h3 style="margin:0 0 10px 0; display:flex; align-items:center; justify-content:space-between;">
              <span>${titleHtml || file.name.replace('.json', '')}</span>
              <div>${badgeHtml}</div>
            </h3>
            ${bodyHtml}
            ${metaHtml ? `<div style="margin-top:10px; padding-top:8px; border-top:1px solid #eee;">${metaHtml}</div>` : ''}
          </div>
          ${linksHtml ? `<div style="margin-top:15px;">${linksHtml}</div>` : ''}
        `;

        container.appendChild(card);
      }
    } catch (e) {
      console.error("Error loading project content:", e);
      container.innerHTML = '<p>Error loading projects. Check browser console.</p>';
    }
  }

  loadProjects();
</script>
</body>
</html>
